name: Update Garden Data

on:
  # Run every hour
  schedule:
    - cron: '0 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

  # Also run on push to main (for testing)
  push:
    branches:
      - main
    paths:
      - 'collect-data.ts'
      - 'generate-report.ts'
      - 'schema.ts'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect fresh data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx collect-data.ts
        timeout-minutes: 10

      - name: Generate report
        run: npx tsx generate-report.ts

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet apps.json README.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps.json README.md
          git commit -m "chore: update garden data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
